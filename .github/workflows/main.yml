name: CI Pipeline

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      - run: pytest -q --cov=. --cov-config=.coveragerc

  docker-build:
    name: Build all release images
    needs: build-lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { version: "1.0.0", file: "versions/ACEest_Fitness_v1.py" }
          - { version: "2.0.0", file: "versions/ACEest_Fitness_v2.py" }
          - { version: "3.0.0", file: "ACEest_Fitness.py" }
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build --build-arg APP_FILE=${{ matrix.file }} \
                       --build-arg APP_VERSION=${{ matrix.version }} \
                       -t aceest-fitness:${{ matrix.version }} .
      - name: Run tests inside the container
        run: |
          docker run --rm --user root -e EXPECTED_VERSION=${{ matrix.version }} \
            -v "$PWD/tests:/app/tests:ro" -v "$PWD/pytest.ini:/app/pytest.ini:ro" \
            aceest-fitness:${{ matrix.version }} \
            sh -c "pip install -q pytest==8.3.3 && pytest -q tests/test_container_smoke.py"
