apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-b
  namespace: aceest-ab
  labels:
    app: aceest
    variant: b
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest
      variant: b
  template:
    metadata:
      labels:
        app: aceest
        variant: b
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:3.0.0
          ports:
            - containerPort: 5000
          env:
            - name: DB_PATH
              value: /data/aceest_fitness.db
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
